<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herbstgarderobe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kopf">
    <h1>Herbstgarderobe</h1>
    <p>Ruhige Farben, weicher Strick und Schnitte, die man gerne trägt.</p>
  </header>

  <main class="strecke" id="strecke" tabindex="0">
    <figure>
      <img src="Blaues_Sip.png" alt="Blaues Sip" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">01 / 14</span>
        <h2>Blaues Sip</h2>
        <p>Ein tiefes Blau, ruhig und zeitlos.</p>
      </figcaption>
    </figure>
    <figure>
      <img src="Graues_Sip.png" alt="Graues Sip" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">02 / 14</span>
        <h2>Graues Sip</h2>
        <p>Dezentes Grau für jeden Tag.</p>
      </figcaption>
    </figure>
    <figure>
      <img src="Grünes_Sip.png" alt="Grünes Sip" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">03 / 14</span>
        <h2>Grünes Sip</h2>
        <p>Waldgrün, weich und warm.</p>
      </figcaption>
    </figure>
    <figure>
      <img src="Pullover_Grün_Zöpfe.png" alt="Pullover Grün Zöpfe" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">04 / 14</span>
        <h2>Pullover Grün Zöpfe</h2>
        <p>Klassischer Zopfstrick in sattem Grün.</p>
      </figcaption>
    </figure>
    <figure>
      <img src="Pullover_Grün.png" alt="Pullover Grün" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">05 / 14</span>
        <h2>Pullover Grün</h2>
        <p>Schlicht und gemütlich, zum Wohlfühlen.</p>
      </figcaption>
    </figure>
    <figure>
      <img src="Pullover_Grau_Zöpfe.png" alt="Pullover Grau Zöpfe" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">06 / 14</span>
        <h2>Pullover Grau Zöpfe</h2>
        <p>Zopfstrick in sanftem Grau.</p>
      </figcaption>
    </figure>
    <figure>
      <img src="Hose_beige.png" alt="Hose beige" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">07 / 14</span>
        <h2>Hose beige</h2>
        <p>Heller Ton, ruhige Linie.</p>
      </figcaption>
    </figure>
    <figure>
      <img src="Hose_beige_2.png" alt="Hose beige 2" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">08 / 14</span>
        <h2>Hose beige 2</h2>
        <p>Dieselbe Farbe, ein zweiter Blick.</p>
      </figcaption>
    </figure>
    <figure>
      <img src="Hose_blau.png" alt="Hose blau" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">09 / 14</span>
        <h2>Hose blau</h2>
        <p>Dunkles Blau, klar und elegant.</p>
      </figcaption>
    </figure>
    <figure>
      <img src="Handschuhe_grau.png" alt="Handschuhe grau" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">10 / 14</span>
        <h2>Handschuhe grau</h2>
        <p>Ein feines Detail für kalte Tage.</p>
      </figcaption>
    </figure>
    <figure>
      <img src="Polo_Shirt_Grau_beige.png" alt="Polo Shirt Grau beige" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">11 / 14</span>
        <h2>Polo Shirt Grau beige</h2>
        <p>Grau und Beige, leise kombiniert.</p>
      </figcaption>
    </figure>
	
	<figure>
      <img src="Jacke_Beige.png" alt="Polo Shirt Grau beige" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">12 / 14</span>
        <h2>Jacke beige</h2>
        <p>Grün und Beige, leise kombiniert.</p>
      </figcaption>
    </figure>
	
	<figure>
      <img src="Jacke_Blau.png" alt="Polo Shirt Grau beige" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">13 / 14</span>
        <h2>Jacke Blau</h2>
        <p>schönes unauffälliges Blau.</p>
      </figcaption>
    </figure>
	
	<figure>
      <img src="Jacke_Dunkel_Blau.png" alt="Polo Shirt Grau beige" loading="lazy" draggable="false">
      <figcaption>
        <span class="nr">14 / 14</span>
        <h2>Steppjacke Blau</h2>
        <p>Etwas anderes.</p>
      </figcaption>
    </figure>
  </main>

  <button class="pfeil zurueck" id="zurueck" aria-label="Zurück"></button>
  <button class="pfeil weiter" id="weiter" aria-label="Weiter"></button>

  <script>
    const s = document.getElementById("strecke");
    const schritt = () => {
      const f = s.querySelector("figure");
      return f.offsetWidth + parseFloat(getComputedStyle(s).columnGap);
    };
    const gehe = r => s.scrollBy({ left: r * schritt(), behavior: "smooth" });
    document.getElementById("weiter").onclick = () => gehe(1);
    document.getElementById("zurueck").onclick = () => gehe(-1);

    addEventListener("keydown", e => {
      if (e.key === "ArrowRight") gehe(1);
      if (e.key === "ArrowLeft") gehe(-1);
    });

    /* Mausrad / Trackpad nach oben und unten blättert seitlich, ein Impuls = ein Bild */
    let sperre = false;
    addEventListener("wheel", e => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; /* seitliches Wischen läuft von selbst */
      e.preventDefault();
      if (sperre || Math.abs(e.deltaY) < 8) return;
      sperre = true;
      gehe(e.deltaY > 0 ? 1 : -1);
      setTimeout(() => sperre = false, 650);
    }, { passive: false });
  </script>
</body>
</html>
